<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128' width='128' height='128'>
  <defs>
    <!-- Dark Cyber Gradient matching HireShield dark surfaces -->
    <linearGradient id='bg128' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0B1625'/>
      <stop offset='50%' stop-color='#07111F'/>
      <stop offset='100%' stop-color='#05070B'/>
    </linearGradient>
    <!-- Electric Blue Cyber Border Gradient -->
    <linearGradient id='border128' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#5DA2F0' stop-opacity='0.9'/>
      <stop offset='50%' stop-color='#1677E8' stop-opacity='0.6'/>
      <stop offset='100%' stop-color='#0F59C5' stop-opacity='0.3'/>
    </linearGradient>
    <!-- Shield Outline Gradient -->
    <linearGradient id='shield128' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#68B0FF'/>
      <stop offset='50%' stop-color='#1677E8'/>
      <stop offset='100%' stop-color='#0F59C5'/>
    </linearGradient>
    <!-- Cyber Glow -->
    <radialGradient id='glow128' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#1677E8' stop-opacity='0.35'/>
      <stop offset='100%' stop-color='#1677E8' stop-opacity='0'/>
    </radialGradient>
  </defs>
  <!-- Background Squircle Container Badge -->
  <rect x='4' y='4' width='120' height='120' rx='28' fill='url(#bg128)' stroke='url(#border128)' stroke-width='2.5'/>
  <circle cx='64' cy='64' r='46' fill='url(#glow128)'/>
  <!-- Official HireShield Shield Graphic -->
  <g transform='translate(23, 19) scale(3.4)'>
    <path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z' 
          fill='rgba(22, 119, 232, 0.22)' 
          stroke='url(#shield128)' 
          stroke-width='2' 
          stroke-linecap='round' 
          stroke-linejoin='round'/>
    <!-- Inner Tech Inset Contour -->
    <path d='M12 18s5-2.5 5-6.5V7.5L12 5.5 7 7.5V11.5c0 4 5 6.5 5 6.5z' 
          fill='none' 
          stroke='#5DA2F0' 
          stroke-width='0.8' 
          stroke-dasharray='3 1.5'
          opacity='0.85'/>
  </g>
</svg>